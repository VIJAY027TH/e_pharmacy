spring.application.name=e-pharmacy

# Server
server.port=${PORT:8081}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pharmavital_epharmacy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Delivery estimate (minutes after order creation)
delivery.eta.minutes=3

# Maximum individual units purchasable without an authorized prescription
medicine.quantity.limit=100

# An approved prescription permits more than the standard limit but never more than this per medicine.
medicine.prescription.quantity.limit=200

# Polling cadence for server-side automatic delivery status updates
delivery.status.check-interval-ms=1000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.directory=${UPLOAD_DIR:uploads/prescriptions}
